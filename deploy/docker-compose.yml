# 服务器端部署用（不编译，只拉取 GitHub Actions 构建好的镜像）
# 用法：mkdir -p /opt/qq-farm-bot && cd /opt/qq-farm-bot
#      把本文件和 auto-update.sh 放进去，然后 docker compose up -d
#      自动更新靠 cron 调 auto-update.sh，不依赖 Docker Hub

services:
  qq-farm-bot:
    image: ghcr.io/coeushub/qq-farm-bot-li:latest
    pull_policy: always
    container_name: qq-farm-bot
    restart: unless-stopped
    ports:
      - "${PORT:-3007}:3007"
    volumes:
      - qq-farm-data:/app/core/data
      - qq-farm-logs:/app/core/data/logs
    environment:
      - TZ=${TZ:-Asia/Shanghai}
      - NODE_ENV=production
      - ADMIN_PORT=3007
    healthcheck:
      # 必须用 127.0.0.1：容器内 localhost 可能解析到 ::1，而服务只监听 IPv4
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3007/api/game-version"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  qq-farm-data:
    name: qq-farm-data
  qq-farm-logs:
    name: qq-farm-logs
